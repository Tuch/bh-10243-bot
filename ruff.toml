# Deterministic lint scope for CI. Pyflakes + core pycodestyle + import sorting.
# Blind-except (BLE001) and executable-shebang (EXE001) are intentionally not
# selected: the broad excepts are deliberate robustness, and the scripts are
# run via `python <file>` by the cron scheduler, not executed directly.
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I"]
