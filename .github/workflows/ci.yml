name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile scripts (syntax check)
        run: python -m py_compile scripts/*.py

      - name: Ruff lint
        run: |
          pip install ruff
          ruff check scripts/
